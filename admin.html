<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BuyHub Admin</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header class="site-header"><a class="brand" href="/">BuyHub<span>.</span></a><span class="tagline">Private store dashboard</span></header>
<main class="catalogue admin-wrap"><section id="login-panel" class="admin-panel"><p class="eyebrow">STORE OWNER</p><h1>Sign in to BuyHub</h1><p>Only you should use this private dashboard.</p><form id="login-form"><label>Admin password<input id="admin-password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Sign in</button><p id="login-error" class="error" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="admin-top"><div><p class="eyebrow">YOUR STORE</p><h1>Manage products</h1><p>Upload a PDF, set its price and publish it on your storefront.</p></div><button id="logout" class="button">Sign out</button></div>
<form id="product-form" class="admin-panel"><h2>Add a digital product</h2><label>Product title<input id="product-name" maxlength="100" required placeholder="e.g. Small Business Guide"></label><label>Description<textarea id="product-description" maxlength="500" required placeholder="What will customers learn or receive?"></textarea></label><label>Price (USD)<input id="product-price" type="number" min="0.50" max="10000" step="0.01" required placeholder="5.00"></label><label>PDF file<input id="product-file" type="file" accept="application/pdf,.pdf" required></label><button id="publish" class="button primary" type="submit">Upload and publish</button><p id="form-message" role="status"></p></form>
<div class="admin-panel"><h2>Your published products</h2><div id="admin-products"><p>Loading…</p></div></div></section></main><script type="module" src="/assets/admin.js"></script></body></html>
