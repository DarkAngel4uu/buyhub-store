<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order status — BuyHub</title><link rel="stylesheet" href="/assets/styles.css"></head><body><header class="site-header"><a class="brand" href="/">BuyHub<span>.</span></a></header><main class="catalogue"><p class="eyebrow">BUYHUB ORDER</p><h1>Your payment status</h1><p id="status">Checking your order…</p><a id="download" class="button primary" hidden>Download your PDF</a><p><a href="/">Return to BuyHub</a></p></main><script>const id=new URLSearchParams(location.search).get("order");const status=document.querySelector("#status"),link=document.querySelector("#download");if(!id){status.textContent="No order reference was provided."; }else{fetch("/.netlify/functions/get-download?order="+encodeURIComponent(id)).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Payment is not confirmed yet.");status.textContent="Payment confirmed. Your download is ready.";link.href=d.url;link.hidden=false;link.textContent="Download PDF"}).catch(e=>status.textContent=e.message+" If you have just paid, wait a moment and refresh this page.")}</script></body></html>
